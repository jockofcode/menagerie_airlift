# spin manifest — an application needs no [package] identity.
# Add dependencies like:
#   [dependencies]
#   ansi = { path = "../spinel-ansi" }

[dependencies]
sdl = { git = "https://github.com/jockofcode/sdl" }
# Laya picks the title demo's goals (lib/airlift/laya_pilot.rb). The weights
# live in the laya checkout (../laya/bin/fetch_model.sh); without them the
# demo falls back to the scripted AI.
laya = { path = "../laya" }
